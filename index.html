  <script>
  (function () {
    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : '';
    }

    function sendCapi(eventName, eventId) {
      var payload = {
        event_name: eventName,
        event_id: eventId,
        event_source_url: window.location.href,
        fbp: getCookie('_fbp'),
        fbc: getCookie('_fbc')
      };
      return fetch('/api/capi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(function () {});
    }

    function track(eventName, params) {
      var eventId = uuid();
      if (typeof fbq === 'function') {
        fbq('track', eventName, params || {}, { eventID: eventId });
      }
      sendCapi(eventName, eventId);
      return eventId;
    }

    window.valeAltoTrack = track;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { track('PageView'); });
    } else {
      track('PageView');
    }
  })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0A0A0A;
      --dark: #111111;
      --red: #C0261B;
      --red-bright: #E02D1B;
      --white: #FFFFFF;
      --gray: #888888;
      --light: #E8E8E8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ── HERO ── */
    .hero {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(192,38,27,.08) 0%, transparent 70%),
        var(--black);
    }

    /* subtle top/bottom red lines */
    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: var(--red);
    }
    .hero::before { top: 0; }
    .hero::after { bottom: 0; }

    /* ── LOGO ── */
    .logo-wrap {
      margin-bottom: 36px;
    }
    .logo-wrap img {
      width: 200px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 40px rgba(192,38,27,.25));
    }

    /* ── TAG ── */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--light);
      margin-bottom: 24px;
      padding: 6px 16px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 100px;
    }
    .tag span {
      font-size: 16px;
    }

    /* ── HEADLINE ── */
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: .02em;
      color: var(--white);
      max-width: 640px;
      margin-bottom: 16px;
    }
    .headline em {
      font-style: normal;
      color: var(--red-bright);
    }

    /* ── SUB ── */
    .subheadline {
      font-size: clamp(.95rem, 2.2vw, 1.1rem);
      font-weight: 400;
      color: var(--gray);
      max-width: 440px;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    /* ── CTA ── */
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--red);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(255,255,255,.15);
      touch-action: manipulation;
      position: relative;
      z-index: 1;
      transition: background .2s, transform .15s;
      box-shadow:
        0 4px 24px rgba(192,38,27,.35),
        0 0 0 1px rgba(255,255,255,.06);
    }
    .cta:hover {
      background: var(--red-bright);
      transform: translateY(-2px);
    }
    .cta:active {
      transform: translateY(0);
    }
    .cta svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      pointer-events: none;
      flex-shrink: 0;
    }

    /* pulse ring */
    .cta-wrap {
      position: relative;
      margin-bottom: 48px;
    }
    .cta-wrap::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 10px;
      border: 2px solid var(--red);
      opacity: 0;
      pointer-events: none;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.04); }
    }

    /* ── STATS ── */
    .stats {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      color: var(--red-bright);
      line-height: 1;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--gray);
      margin-top: 4px;
      letter-spacing: .03em;
    }

    /* ── DIVIDER BETWEEN STATS ── */
    .stat + .stat {
      position: relative;
      padding-left: 40px;
    }
    .stat + .stat::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,.1);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .logo-wrap img { width: 160px; }
      .stats { gap: 24px; }
      .stat + .stat { padding-left: 24px; }
      .cta { padding: 14px 28px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta-wrap::after { animation: none; }
    }
  </style>

  <script>
  (function () {
    var WA_URL = 'https://wa.me/5547989010946?text=Ol%C3%A1%2C%20quero%20comprar%20em%20atacado!';
    var cta = document.getElementById('cta-catalogo');
    if (!cta) return;

    cta.setAttribute('href', WA_URL);

    cta.addEventListener('click', function (e) {
      if (typeof window.valeAltoTrack === 'function') {
        window.valeAltoTrack('Lead');
      }
      // Garante redirect no mobile (mesmo se o browser bloquear o comportamento padrão)
      e.preventDefault();
      window.location.href = WA_URL;
    }, { passive: false });
  })();
